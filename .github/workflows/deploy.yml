name: Deploy immutable release

on:
  workflow_dispatch:
    inputs:
      target:
        description: Deployment slot
        required: true
        type: choice
        options:
          - dev
          - production

permissions:
  actions: read
  contents: read

concurrency:
  group: galata-vps-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Require successful exact-SHA verification run
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/main
          run_id=$(
            gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/verify.yml/runs" \
              -f branch=main -f status=success -f per_page=100 \
              --jq ".workflow_runs[] | select(.head_sha == \"$SELECTED_SHA\" and .conclusion == \"success\") | .id" \
              | head -1
          )
          test -n "$run_id" || {
            echo "No successful Verify site and server run exactly matches $SELECTED_SHA" >&2
            exit 1
          }

      - name: Checkout current immutable media
        uses: actions/checkout@v7
        with:
          repository: galata-dergisi/static-assets
          path: .static-assets
          token: ${{ secrets.STATIC_ASSETS_TOKEN }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install Node dependencies
        run: npm ci

      - name: Build browser, SSR, and generated site
        run: npm run build
        env:
          GALATA_STATIC_ASSETS_ROOT: .static-assets/server-assets/public/images

      - uses: actions/setup-go@v7
        with:
          go-version-file: .go-version
          cache: false

      - name: Build Linux releases
        run: sh scripts/build-release.sh
        env:
          GALATA_MEDIA_ROOT: .static-assets/server-assets/public

      - name: Verify release checksums
        working-directory: release
        run: sha256sum -c SHA256SUMS

      - name: Scan releases for private database values
        run: node scripts/scan-release.js release/galata-server-linux-amd64 release/galata-server-linux-arm64

      - name: Smoke-test deployable Linux release
        env:
          CONTRIBUTIONS_DIR: ${{ runner.temp }}/galata-contributions
          LISTEN_ADDR: 127.0.0.1:3000
          TURNSTILE_ALLOWED_HOSTNAMES: example.invalid
          TURNSTILE_SECRET_KEY: deployment-artifact-smoke-test
        run: |
          set -euo pipefail
          release/galata-server-linux-amd64 > "$RUNNER_TEMP/galata-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true; wait "$server_pid" 2>/dev/null || true' EXIT
          expected_release=$(sed -n 's/^embedded_site_release=//p' release/RELEASE-MANIFEST)
          for attempt in {1..30}; do
            if health=$(curl --fail --silent --show-error --max-time 2 http://127.0.0.1:3000/healthz); then
              printf '%s' "$health" | grep -Fq '"ok":true'
              printf '%s' "$health" | grep -Fq "\"release\":\"$expected_release\""
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/galata-server.log" >&2
          exit 1

      - name: Upload tested deployment artifact
        uses: actions/upload-artifact@v7
        with:
          name: galata-server-linux
          path: |
            release/galata-server-linux-*
            release/RELEASE-MANIFEST
            release/MEDIA-SHA256SUMS
            release/SHA256SUMS
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    steps:
      - name: Checkout selected main commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Download tested deployment artifact
        uses: actions/download-artifact@v8
        with:
          name: galata-server-linux
          path: release

      - name: Validate artifact provenance
        id: provenance
        run: |
          set -euo pipefail
          test "$(sed -n 's/^application_commit=//p' release/RELEASE-MANIFEST)" = "$GITHUB_SHA"
          static_commit=$(sed -n 's/^static_assets_commit=//p' release/RELEASE-MANIFEST)
          printf '%s' "$static_commit" | grep -Eq '^[0-9a-f]{40}$'
          echo "static_commit=$static_commit" >> "$GITHUB_OUTPUT"
          (cd release && sha256sum -c SHA256SUMS)

      - name: Checkout immutable media commit
        uses: actions/checkout@v7
        with:
          repository: galata-dergisi/static-assets
          ref: ${{ steps.provenance.outputs.static_commit }}
          path: .static-assets
          token: ${{ secrets.STATIC_ASSETS_TOKEN }}
          persist-credentials: false

      - name: Install restricted SSH identity
        env:
          DEPLOY_KEY: ${{ secrets.GALATA_DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.GALATA_SSH_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          install -d -m 0700 "$RUNNER_TEMP/galata-ssh"
          printf '%s\n' "$DEPLOY_KEY" > "$RUNNER_TEMP/galata-ssh/deploy-key"
          printf '%s\n' "$KNOWN_HOSTS" > "$RUNNER_TEMP/galata-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/galata-ssh/deploy-key" "$RUNNER_TEMP/galata-ssh/known_hosts"

      - name: Deploy prebuilt release
        env:
          GALATA_DEPLOY_HOST: ${{ secrets.GALATA_DEPLOY_HOST }}
          GALATA_DEPLOY_PORT: ${{ secrets.GALATA_DEPLOY_PORT }}
          GALATA_DEPLOY_SSH_KEY_PATH: ${{ runner.temp }}/galata-ssh/deploy-key
          GALATA_SSH_KNOWN_HOSTS_FILE: ${{ runner.temp }}/galata-ssh/known_hosts
        run: |
          ./ops/deploy-server.sh deploy "${{ inputs.target }}" \
            --release-dir release \
            --media-root .static-assets/server-assets/public \
            --yes
          ./ops/deploy-server.sh verify "${{ inputs.target }}"
