name: galata-production-preview

services:
  app:
    build:
      context: ../..
      dockerfile: ops/zap/Dockerfile
      target: scan-target
    environment:
      CONTRIBUTIONS_DIR: /var/lib/galata-contributions
      EXTERNAL_MEDIA_DIR: /var/www/galatadergisi.org/public
      LISTEN_ADDR: 127.0.0.1:3000
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-local-production-placeholder}
      TURNSTILE_ALLOWED_HOSTNAMES: galatadergisi.org,www.galatadergisi.org
    read_only: true
    volumes:
      - type: volume
        source: contributions
        target: /var/lib/galata-contributions
    ports:
      - "127.0.0.1:${GALATA_PREVIEW_HTTPS_PORT:-44443}:443"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s

  nginx:
    build:
      context: ../..
      dockerfile: ops/local-production/Dockerfile.nginx
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - type: bind
        source: ${GALATA_MEDIA_ROOT:-../../../galata-dergisi-static-assets/server-assets/public}
        target: /var/www/galatadergisi.org/public
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

volumes:
  contributions:
