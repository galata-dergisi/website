name: galata-production-preview

services:
  app:
    build:
      context: ../..
      dockerfile: ops/zap/Dockerfile
      target: scan-target
    environment:
      LISTEN_ADDR: 127.0.0.1:3000
    read_only: true
    ports:
      - "127.0.0.1:${GALATA_PREVIEW_HTTPS_PORT:-44443}:443"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 25s

  nginx:
    build:
      context: ../..
      dockerfile: ops/local-production/Dockerfile.nginx
      args:
        GALATA_PREVIEW_CSP_VARIANT: ${GALATA_PREVIEW_CSP_VARIANT:-production}
        GALATA_PREVIEW_ENFORCE_CSP: ${GALATA_PREVIEW_ENFORCE_CSP:-0}
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    volumes:
      - type: bind
        source: ${GALATA_MEDIA_ROOT:-../../../galata-dergisi-static-assets/server-assets/public}
        target: /var/www/galatadergisi.org/public
        read_only: true
        bind:
          create_host_path: false
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s

  browser:
    profiles:
      - csp
    build:
      context: ../..
      dockerfile: ops/local-production/Dockerfile.browser
    depends_on:
      nginx:
        condition: service_started
    network_mode: service:app
    environment:
      CHROME_BIN: /usr/bin/chromium-browser
      GALATA_CSP_BASE_URL: https://localhost
      GALATA_CSP_VARIANT: ${GALATA_PREVIEW_CSP_VARIANT:-production}
      HOME: /tmp/chromium-home
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 10s
