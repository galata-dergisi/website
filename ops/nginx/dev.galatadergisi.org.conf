server {
  server_tokens off;
  access_log /var/log/nginx/dev.galatadergisi.org/access.log;
  error_log /var/log/nginx/dev.galatadergisi.org/error.log notice;
  server_name dev.galatadergisi.org;
  root /var/www/dev.galatadergisi.org/public/;
  # Cloudflare Access authenticates public requests before they enter the
  # tunnel. The origin remains loopback-only for local activation probes.
  add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

  if ($host != dev.galatadergisi.org) {
    return 444;
  }
  error_page 429 = @dev_contribution_throttled;

  location = /robots.txt {
    default_type text/plain;
    return 200 "User-agent: *\nDisallow: /\n";
  }

  location = /healthz {
    proxy_pass http://galata_dev_server;
    proxy_set_header Host $host;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    expires -1;
  }

  location ~ ^/images/sayi[0-9]+/ { try_files $uri =404; }

  location ~ ^/magazines/(?<magazine_index>sayi[0-9]+)/audio/(?<audio_file>[^/]+)$ {
    alias /var/www/dev.galatadergisi.org/public/audio/$magazine_index/$audio_file;
    add_header Accept-Ranges bytes always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
  }

  location / {
    client_max_body_size 52m;
    proxy_request_buffering off;
    limit_req zone=galata_dev_contribution_rate burst=4 nodelay;
    limit_req_status 429;
    limit_req_log_level notice;
    limit_conn galata_dev_contribution_connections 1;
    limit_conn_status 429;
    limit_conn_log_level notice;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-Connecting-IPv6 "";
    proxy_set_header CF-Pseudo-IPv4 "";
    proxy_set_header True-Client-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Content-Type-Options;
    proxy_connect_timeout 5s;
    proxy_read_timeout 130s;
    proxy_send_timeout 130s;
    proxy_pass http://galata_dev_server;
    proxy_redirect off;
  }

  location @dev_contribution_throttled {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "60" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    add_header Strict-Transport-Security "max-age=63072000" always;
    return 429 '{"ok":false,"code":"submission_throttled","message":"Çok fazla gönderi işleniyor. Lütfen bir dakika sonra tekrar deneyin."}';
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Strict-Transport-Security "max-age=63072000" always;

  listen 127.0.0.1:8080;
}
