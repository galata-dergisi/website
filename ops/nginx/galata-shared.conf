## Included once from nginx's http context.

map $http_cf_connecting_ip $galata_client_address {
  default $http_cf_connecting_ip;
  "" $remote_addr;
}

map "$request_method:$uri" $galata_contribution_client_key {
  default "";
  "POST:/katkida-bulunun" $galata_client_address;
}

map "$request_method:$uri" $galata_dev_contribution_key {
  default "";
  "POST:/katkida-bulunun" $galata_client_address;
}

limit_req_zone $galata_contribution_client_key zone=galata_contribution_rate:10m rate=1r/m;
limit_conn_zone $galata_contribution_client_key zone=galata_contribution_connections:10m;
limit_req_zone $galata_dev_contribution_key zone=galata_dev_contribution_rate:10m rate=1r/m;
limit_conn_zone $galata_dev_contribution_key zone=galata_dev_contribution_connections:10m;

upstream galata_server {
  server 127.0.0.1:3000;
  keepalive 16;
}

upstream galata_dev_server {
  server 127.0.0.1:3001;
  keepalive 16;
}
