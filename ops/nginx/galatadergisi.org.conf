server {
  server_tokens off;
  error_log /var/log/nginx/galatadergisi.org/error.log notice;
  server_name galatadergisi.org www.galatadergisi.org;
  root /var/www/galatadergisi.org/public/;
  include /etc/nginx/snippets/galata-security-headers.conf;
  include /etc/nginx/snippets/galata-production-csp.conf;

  if ($host !~* ^(www\.)?galatadergisi\.org$) {
    return 444;
  }
  location = /healthz {
    proxy_pass http://galata_server;
    proxy_set_header Host $host;
    include /etc/nginx/snippets/galata-security-headers.conf;
    include /etc/nginx/snippets/galata-production-csp.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;
  }

  location ~ ^/images/sayi[0-9]+/ {
    try_files $uri =404;
  }

  location ~ ^/magazines/(?<magazine_index>sayi[0-9]+)/audio/(?<audio_file>[^/]+)$ {
    alias /var/www/galatadergisi.org/public/audio/$magazine_index/$audio_file;
    include /etc/nginx/snippets/galata-security-headers.conf;
    include /etc/nginx/snippets/galata-production-csp.conf;
    add_header Accept-Ranges bytes always;
  }

  location / {
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header CF-Connecting-IP "";
    proxy_set_header CF-Connecting-IPv6 "";
    proxy_set_header CF-Pseudo-IPv4 "";
    proxy_set_header True-Client-IP "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Real-IP "";
    proxy_set_header X-Forwarded-For "";
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header X-Content-Type-Options;
    proxy_connect_timeout 5s;
    proxy_pass http://galata_server;
    proxy_redirect off;
  }

  gzip on;
  gzip_vary on;
  gzip_proxied any;
  gzip_comp_level 6;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
  listen 127.0.0.1:8080;
}
