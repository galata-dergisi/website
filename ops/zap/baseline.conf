# ZAP baseline rule configuration.
#
# The harness scans the production Go application directly. TLS and the
# clickjacking, HSTS, and nosniff headers added by ops/nginx are outside this
# container boundary. Unlisted rules are reported as INFO by -i. WARN findings
# remain visible in the reports, while these high-confidence disclosures fail
# the scan.
10020	IGNORE	(X-Frame-Options Header Scanner - set by production nginx)
10021	IGNORE	(X-Content-Type-Options Header Missing - set by production nginx)
10023	FAIL	(Information Disclosure - Debug Error Messages)
10035	IGNORE	(Strict-Transport-Security Header - set by production nginx)
90022	FAIL	(Application Error Disclosure)
