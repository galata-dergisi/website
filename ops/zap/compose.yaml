name: galata-zap

services:
  app:
    build:
      context: ../..
      dockerfile: ops/zap/Dockerfile
      target: scan-target
    environment:
      CONTRIBUTIONS_DIR: /var/lib/galata-contributions
      LISTEN_ADDR: 0.0.0.0:3000
      TURNSTILE_SECRET_KEY: zap-scan-placeholder
      TURNSTILE_ALLOWED_HOSTNAMES: galatadergisi.org,www.galatadergisi.org
    read_only: true
    tmpfs:
      - /var/lib/galata-contributions:mode=0700,uid=65532,gid=65532
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none
    networks:
      - scan

  zap:
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - /zap/config/run-baseline.sh
    environment:
      ZAP_SPIDER_MINUTES: ${ZAP_SPIDER_MINUTES:-1}
      ZAP_TARGET: http://app:3000
      ZAP_TIMEOUT_MINUTES: ${ZAP_TIMEOUT_MINUTES:-10}
    volumes:
      - type: bind
        source: ./baseline.conf
        target: /zap/config/baseline.conf
        read_only: true
      - type: bind
        source: ./run-baseline.sh
        target: /zap/config/run-baseline.sh
        read_only: true
      - type: bind
        source: ./check-turnstile-contract.sh
        target: /zap/config/check-turnstile-contract.sh
        read_only: true
      - type: bind
        source: ../../zap-reports
        target: /zap/wrk
    working_dir: /zap/wrk
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - scan

  zap-active:
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    healthcheck:
      disable: true
    profiles:
      - active
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - /zap/config/run-active.sh
    environment:
      ZAP_ACTIVE_MAX_DURATION_MINUTES: ${ZAP_ACTIVE_MAX_DURATION_MINUTES:-10}
      ZAP_ACTIVE_MAX_RULE_DURATION_MINUTES: ${ZAP_ACTIVE_MAX_RULE_DURATION_MINUTES:-2}
      ZAP_ACTIVE_SPIDER_MINUTES: ${ZAP_ACTIVE_SPIDER_MINUTES:-1}
      ZAP_ACTIVE_TARGET: ${ZAP_ACTIVE_TARGET:-http://app:3000/katkida-bulunun}
      ZAP_ACTIVE_TIMEOUT_MINUTES: ${ZAP_ACTIVE_TIMEOUT_MINUTES:-10}
      ZAP_TARGET: http://app:3000
    volumes:
      - type: bind
        source: ./active.conf
        target: /zap/config/active.conf
        read_only: true
      - type: bind
        source: ./run-active.sh
        target: /zap/config/run-active.sh
        read_only: true
      - type: bind
        source: ./check-turnstile-contract.sh
        target: /zap/config/check-turnstile-contract.sh
        read_only: true
      - type: bind
        source: ../../zap-reports
        target: /zap/wrk
    working_dir: /zap/wrk
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - scan

networks:
  scan:
    internal: true
