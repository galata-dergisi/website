name: galata-zap

services:
  app:
    build:
      context: ../..
      dockerfile: ops/zap/Dockerfile
      target: scan-target
      additional_contexts:
        galata_static_images: ${GALATA_MEDIA_ROOT:-../../../galata-dergisi-static-assets/server-assets/public}/images
    environment:
      LISTEN_ADDR: ${ZAP_APP_LISTEN_ADDR:-127.0.0.1:3000}
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none
    networks:
      scan:
        aliases:
          - galatadergisi.org

  nginx:
    build:
      context: ../..
      dockerfile: ops/zap/Dockerfile.nginx
    depends_on:
      app:
        condition: service_started
    network_mode: service:app
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    logging:
      driver: none

  zap:
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    healthcheck:
      disable: true
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - /zap/config/run-baseline.sh
    environment:
      ZAP_REPORT_STEM: ${ZAP_REPORT_STEM:-zap-report}
      ZAP_RULE_CONFIG: ${ZAP_RULE_CONFIG:-/zap/config/baseline.conf}
      ZAP_SPIDER_MINUTES: ${ZAP_SPIDER_MINUTES:-1}
      ZAP_TARGET: ${ZAP_TARGET:-http://galatadergisi.org:8080}
      ZAP_TIMEOUT_MINUTES: ${ZAP_TIMEOUT_MINUTES:-10}
    volumes:
      - type: bind
        source: .
        target: /zap/config
        read_only: true
      - type: bind
        source: ../../zap-reports
        target: /zap/wrk
    working_dir: /zap/wrk
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - scan

  zap-active:
    image: ${ZAP_IMAGE:-ghcr.io/zaproxy/zaproxy:stable}
    healthcheck:
      disable: true
    profiles:
      - active
    depends_on:
      app:
        condition: service_started
    command:
      - sh
      - /zap/config/run-active.sh
    environment:
      ZAP_ACTIVE_MAX_DURATION_MINUTES: ${ZAP_ACTIVE_MAX_DURATION_MINUTES:-10}
      ZAP_ACTIVE_MAX_RULE_DURATION_MINUTES: ${ZAP_ACTIVE_MAX_RULE_DURATION_MINUTES:-2}
      ZAP_ACTIVE_SPIDER_MINUTES: ${ZAP_ACTIVE_SPIDER_MINUTES:-1}
      ZAP_ACTIVE_TARGET: ${ZAP_ACTIVE_TARGET:-http://galatadergisi.org:8080/}
      ZAP_ACTIVE_TIMEOUT_MINUTES: ${ZAP_ACTIVE_TIMEOUT_MINUTES:-10}
      ZAP_REPORT_STEM: ${ZAP_REPORT_STEM:-zap-active-report}
      ZAP_RULE_CONFIG: ${ZAP_RULE_CONFIG:-/zap/config/active.conf}
      ZAP_TARGET: ${ZAP_TARGET:-http://galatadergisi.org:8080}
    volumes:
      - type: bind
        source: .
        target: /zap/config
        read_only: true
      - type: bind
        source: ../../zap-reports
        target: /zap/wrk
    working_dir: /zap/wrk
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - scan

networks:
  scan:
    internal: true
